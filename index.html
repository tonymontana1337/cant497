<style>
/* ==== ТЕМА ======================================================== */
@property --bg{syntax:'<color>';inherits:true;initial-value:#ffffff}
@property --accent-1{syntax:'<color>';inherits:true;initial-value:#1d1d1f}
@property --accent-2{syntax:'<color>';inherits:true;initial-value:#8e8e93}
@property --accent-3{syntax:'<color>';inherits:true;initial-value:#1d1d1f}
@property --glow-1{syntax:'<color>';inherits:true;initial-value:rgba(29,29,31,.03)}
@property --glow-2{syntax:'<color>';inherits:true;initial-value:rgba(29,29,31,.03)}
@property --glow-3{syntax:'<color>';inherits:true;initial-value:rgba(29,29,31,.03)}
:root{
  --bg:#ffffff;
  --text:#1d1d1f;
  --muted:#86868b;
  --line:#e8e8ed;
  --soft:#f5f5f7;
  --accent-1:#1d1d1f;
  --accent-2:#8e8e93;
  --accent-3:#1d1d1f;
  --glow-1:rgba(29,29,31,.03);
  --glow-2:rgba(29,29,31,.03);
  --glow-3:rgba(29,29,31,.03);
  --dot:#3aa7f5;
  --user-bubble:#1d1d1f;
  --radius:22px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  /* плавная смена цветов темы */
  transition:--bg .9s ease,--accent-1 .9s ease,--accent-2 .9s ease,--accent-3 .9s ease,--glow-1 .9s ease,--glow-2 .9s ease,--glow-3 .9s ease;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
  transition:background-color .9s ease;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* Мягкое атмосферное свечение на фоне */
.glow{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(70vmax 40vmax at 50% -8%, var(--glow-2), transparent 70%),
    radial-gradient(70vmax 45vmax at 50% 110%, var(--glow-1), transparent 70%),
    radial-gradient(40vmax 40vmax at 100% 50%, var(--glow-3), transparent 70%);
}

.screen{
  position:fixed;inset:0;z-index:1;
  display:flex;flex-direction:column;
  transition:opacity .6s ease, transform .6s ease, visibility .6s;
}
.screen.hidden{opacity:0;visibility:hidden;pointer-events:none;transform:scale(.98)}

/* ==== ГЛАВНАЯ (уменьшенный логотип Findly.) ======================== */
#landing{align-items:center;justify-content:center;text-align:center;padding:24px}
.logo{
  font-size:clamp(36px, 6.5vw, 68px);
  font-weight:600;
  letter-spacing:-0.04em;
  line-height:1;
}
.logo span{
  color:var(--dot);
}
.tagline{
  margin-top:16px;color:var(--muted);
  font-size:clamp(14px, 1.8vw, 18px);font-weight:400;letter-spacing:-0.01em;
}

.cta{
  position:absolute;left:50%;bottom:max(28px,env(safe-area-inset-bottom));
  transform:translateX(-50%);
  padding:15px 38px;border-radius:999px;
  background:var(--text);color:#fff;
  font-size:16px;font-weight:500;letter-spacing:-0.01em;
  overflow:hidden;isolation:isolate;
  transition:transform .3s ease, box-shadow .3s ease;
  box-shadow:0 8px 30px rgba(0,0,0,.12);
}
.cta::after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:0;
  background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.6) 50%,transparent 65%);
  transform:translateX(-130%);
}
.cta:hover,.cta:focus-visible{
  transform:translateX(-50%) translateY(-3px);outline:none;
  text-shadow:0 0 14px rgba(255,255,255,.85);
  box-shadow:0 16px 40px rgba(0,0,0,.2), inset 0 0 22px rgba(255,255,255,.22), inset 0 0 0 1px rgba(255,255,255,.28);
}
.cta:hover::after,.cta:focus-visible::after{opacity:1;animation:sheen 1.8s ease-in-out infinite}
@keyframes sheen{0%{transform:translateX(-130%)}60%,100%{transform:translateX(130%)}}
.cta:active{transform:translateX(-50%) scale(.97)}

/* ==== ЧАТ ========================================================= */
#chat{align-items:center}
.chat-top{
  width:100%;padding:16px 72px 16px 24px;display:flex;align-items:center;justify-content:space-between;
  background:rgba(255,255,255,.65);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(0,0,0,.06);
  transition:border-color .6s ease;
}
.chat-top .brand{font-size:19px;font-weight:600;letter-spacing:-0.03em;cursor:pointer}
.chat-top .brand span{color:var(--dot)}
.chat-top .right{display:flex;align-items:center;gap:12px}
.counter{color:var(--muted);font-size:13px;font-weight:500}
.pill{
  padding:8px 16px;border-radius:999px;border:1px solid rgba(0,0,0,.09);background:rgba(255,255,255,.85);
  font-size:14px;font-weight:500;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  transition:border-color .4s ease, background .2s ease;
}
.pill:hover{background:#fff;border-color:var(--accent-1)}

.messages{
  flex:1;width:100%;max-width:760px;overflow-y:auto;
  padding:28px 20px 16px;display:flex;flex-direction:column;gap:18px;
}

.hero{
  margin:auto;text-align:center;padding-bottom:3vh;
  font-size:clamp(20px, 3vw, 26px);
  font-weight:500;
  color:var(--muted);
  letter-spacing:-0.025em;
  line-height:1.25;
}

.msg{max-width:88%;font-size:16px;line-height:1.5;animation:rise .4s ease both}
.msg.user{
  align-self:flex-end;
  background:var(--user-bubble);
  color:#fff;
  padding:12px 18px;border-radius:20px 20px 6px 20px;
  transition:background .7s ease;
}
.msg.ai{align-self:flex-start}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.typing{display:inline-flex;gap:5px;padding:6px 0}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--accent-1);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}
.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* ==== КАРТОЧКИ ==================================================== */
.cards{display:grid;gap:12px;margin-top:12px;width:min(100%,700px)}
.card{
  display:flex;gap:16px;align-items:center;
  padding:16px;border:1px solid rgba(0,0,0,.07);border-radius:var(--radius);
  background:rgba(255,255,255,.82);backdrop-filter:blur(12px);
  text-decoration:none;color:inherit;
  transition:transform .25s ease, box-shadow .25s ease, border-color .4s ease, background .4s ease;
}
.card:hover{
  transform:translateY(-2px);
  background:#fff;
  box-shadow:0 12px 32px rgba(0,0,0,.07);
  border-color:var(--accent-1);
}
.thumb{
  flex:none;width:68px;height:68px;border-radius:16px;
  background:linear-gradient(135deg,var(--soft),#fff);
  display:grid;place-items:center;font-size:28px;
}
.card .info{flex:1;min-width:0}
.card .title{font-weight:600;font-size:16px;letter-spacing:-0.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .meta{color:var(--muted);font-size:13px;margin-top:3px}
.card .why{font-size:14px;margin-top:6px;line-height:1.4}
.card .side{text-align:right;flex:none}
.card .price{font-weight:600;font-size:18px}
.badge{
  display:inline-block;margin-top:6px;padding:3px 10px;border-radius:999px;
  font-size:12px;font-weight:600;
  color:color-mix(in srgb,var(--accent-1) 65%,#000);
  background:color-mix(in srgb,var(--accent-1) 13%,#fff);
}

/* ==== ПОЛЕ ВВОДА ================================================== */
.composer{width:100%;max-width:760px;padding:12px 20px max(24px,env(safe-area-inset-bottom))}
.composer form{
  position:relative;
  display:flex;align-items:center;gap:8px;
  padding:8px 8px 8px 22px;border-radius:999px;
  background:rgba(255,255,255,.92);backdrop-filter:blur(14px);
  border:1px solid rgba(0,0,0,.09);
  box-shadow:0 8px 30px rgba(0,0,0,.06);
  transition:border-color .5s ease, box-shadow .5s ease;
}
.composer form:focus-within{
  border-color:var(--accent-1);
  box-shadow:0 10px 36px color-mix(in srgb,var(--accent-1) 14%,transparent);
}
.composer input{
  flex:1;border:none;outline:none;background:none;
  font-family:inherit;font-size:16px;color:var(--text);min-width:0;
}
.send{
  width:44px;height:44px;border-radius:50%;
  background:var(--accent-1);color:#fff;font-size:18px;flex:none;
  transition:background .6s ease, transform .2s ease, opacity .2s ease;
}
.send:hover:not(:disabled){transform:scale(1.04)}
.send:disabled{opacity:.3;cursor:default}

.ph{
  position:absolute;left:22px;right:64px;top:50%;margin-top:-12px;line-height:24px;
  pointer-events:none;color:var(--muted);font-size:16px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.ph.in{animation:phIn .5s ease both}
.ph.leave{animation:phOut .3s ease both}
.ph.hide{display:none}
@keyframes phIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes phOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-8px)}}

/* ==== МОДАЛЬНЫЕ ОКНА ============================================== */
.overlay{
  position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:20px;
  background:rgba(255,255,255,.55);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  opacity:0;visibility:hidden;transition:opacity .3s, visibility .3s;
}
.overlay.show{opacity:1;visibility:visible}
.modal{
  position:relative;width:min(100%,400px);padding:32px 28px 26px;text-align:center;
  border-radius:28px;background:#fff;border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.14);
  transform:translateY(12px) scale(.98);transition:transform .35s ease;
}
.overlay.show .modal{transform:none}
.modal h2{font-size:26px;font-weight:600;letter-spacing:-0.03em}
.modal .sub{color:var(--muted);font-size:15px;margin-top:8px;line-height:1.45}
.modal .x{position:absolute;top:12px;right:16px;font-size:26px;color:var(--muted)}
.field{
  width:100%;margin-top:12px;padding:15px 18px;border-radius:14px;
  border:1px solid var(--line);background:var(--soft);font-family:inherit;font-size:16px;outline:none;
}
.field:focus{border-color:var(--accent-1);background:#fff}
.btn{width:100%;margin-top:16px;padding:15px;border-radius:999px;background:var(--text);color:#fff;font-size:16px;font-weight:500}
.btn.grad{background:linear-gradient(135deg,var(--accent-1),var(--accent-2))}
.btn:disabled{opacity:.5}
.link{margin-top:14px;color:var(--muted);font-size:14px}
.link:hover{color:var(--text)}
.err{color:#d6336c;font-size:13px;margin-top:10px;min-height:16px}
.plan-price{font-size:46px;font-weight:600;letter-spacing:-0.04em;margin-top:18px}
.plan-price small{font-size:16px;color:var(--muted);font-weight:400;letter-spacing:0}
.perks{list-style:none;margin-top:12px;text-align:left;display:inline-block;font-size:15px;line-height:1.9}
.perks li::before{content:"✓";margin-right:10px;color:var(--accent-1);font-weight:700}
.demo{color:var(--muted);font-size:12px;margin-top:12px}

[hidden]{display:none!important}
.lang{position:fixed;top:max(12px,env(safe-area-inset-top));right:18px;z-index:6}
.globe{
  width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
  border:1px solid rgba(0,0,0,.09);background:rgba(255,255,255,.85);backdrop-filter:blur(14px);
  color:var(--text);transition:border-color .3s, transform .2s;
}
.globe:hover{border-color:var(--accent-1);transform:scale(1.05)}
.lang-menu{
  position:absolute;right:0;top:50px;min-width:160px;padding:6px;border-radius:18px;
  background:#fff;border:1px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,.12);
  animation:rise .25s ease both;
}
.lang-menu button{display:block;width:100%;text-align:left;padding:10px 14px;border-radius:12px;font-size:15px}
.lang-menu button:hover{background:var(--soft)}
.lang-menu button.on{color:var(--accent-1);font-weight:600}
.modal.pay{padding:40px 28px 28px}
.modal.pay .plan-price{margin-top:0}
@media (max-width:560px){
  .card{flex-wrap:wrap}
  .card .side{width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center}
  .thumb{width:56px;height:56px;font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<body>
<div class="glow"></div>

<div class="lang" id="lang">
  <button class="globe" id="langBtn" aria-label="Language" aria-haspopup="true">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.7 3.9 5.7 3.9 9s-1.3 6.3-3.9 9c-2.6-2.7-3.9-5.7-3.9-9S9.4 5.7 12 3z"/></svg>
  </button>
  <div class="lang-menu" id="langMenu" hidden></div>
</div>

<section id="landing" class="screen">
  <h1 class="logo">Findly<span>.</span></h1>
  <p class="tagline" data-i18n="tagline"></p>

</section>

<section id="chat" class="screen hidden">

    <div class="hero" id="hero" data-i18n="hero"></div>
  </div>

  <div class="composer">

</section>

<div class="overlay" id="authModal">
  <div class="modal">

        <button class="btn" id="authSubmit" type="submit"></button>
      </form>
      <button class="link" id="authSwitch"></button>
    </div>

    <div id="verifyStep" hidden>
      <h2 data-i18n="verifyTitle"></h2>
      <p class="sub" id="verifyText"></p>
      <p class="err" id="verifyErr"></p>
      <button class="btn" id="verifyDone" data-i18n="verifyDone"></button>
      <button class="link" id="verifyResend" data-i18n="verifyResend"></button><br>
      <button class="link" id="verifyOther" data-i18n="verifyOther"></button>
    </div>
  </div>
</div>

<div class="overlay" id="payModal">
  <div class="modal pay">
    <button class="x" data-close="payModal" aria-label="Close">×</button>
    <div class="plan-price"><span id="planPrice"></span> <small data-i18n="perMonth"></small></div>
    <button class="btn" id="subscribeBtn" data-i18n="subscribe"></button>
  </div>
</div>

// Любой цвет из запроса превращается в одну модную «именную» краску
// (алый, голубой, кофейный, тиффани…). Никаких радужных градиентов.
const COLOR_PALETTES = [
  { name:'scarlet', keys:['red','scarlet','crimson','алы','алая','алое','алые','красн','кармин','червон','roj','roug','rot','红'], c1:'#d6334a', c2:'#f0a3ad', bg:'#fff8f8' },

  { name:'denim', group:'blue', keys:['blue','navy','denim','син','azul','bleu','blau','蓝'], c1:'#3f6fb5', c2:'#9db8e0', bg:'#f7f9fd' },
  { name:'tiffany', keys:['tiffany','тиффани','тифани','мят','mint','cyan','turquoise','teal','бирюз','menta','menthe','minze','türkis','薄荷','青绿'], c1:'#1fb5ad', c2:'#9fe0da', bg:'#f4fcfb' },
  { name:'coffee', keys:['brown','tan','camel','beige','coffee','mocha','latte','cappuccino','chocolate','коричнев','бежев','кофе','мокко','капучино','шоколад','каві','marr','café','cafe','kaffee','braun','咖啡','棕'], c1:'#7a5640', c2:'#c7a58b', bg:'#fbf8f5' },
  { name:'butter', keys:['yellow','gold','mustard','butter','желт','жёлт','золот','жовт','amarill','jaune','gelb','doré','dore','金','黄'], c1:'#d9a921', c2:'#f2dc8c', bg:'#fffdf4' },
  { name:'matcha', keys:['green','olive','emerald','sage','зелен','зелён','оливк','хаки','шалфей','verde','vert','grün','gruen','绿'], c1:'#7a9a63', c2:'#bcd2ab', bg:'#f9fbf6' },
  { name:'lilac', keys:['purple','violet','lilac','lavender','фиолетов','сиренев','лаванд','фіолет','morad','violett','lila','紫'], c1:'#9a82d6', c2:'#cfc2ee', bg:'#faf8ff' },
  { name:'rose', keys:['pink','rose','magenta','розов','пудров','рожев','rosa','粉'], c1:'#e0829f', c2:'#f4c3d2', bg:'#fff8fb' },
  { name:'cherry', keys:['burgundy','cherry','wine','bordeaux','burdeos','бордов','вишн','винн'], c1:'#8e2f42', c2:'#cf8f9b', bg:'#fdf7f8' },

  { name:'graphite', keys:['black','dark','charcoal','graphite','черн','чёрн','темн','графит','чорн','negr','noir','schwarz','黑'], c1:'#2d2d30', c2:'#9a9aa0', bg:'#f7f7f8' },
  { name:'cream', keys:['white','cream','ivory','бел','кремов','молочн','біл','blanc','weiß','weiss','白'], c1:'#a89c88', c2:'#dcd3c4', bg:'#fdfbf7' },
  { name:'stone', keys:['grey','gray','silver','сер','серебр','сір','gris','grau','灰','银'], c1:'#868a90', c2:'#c6c9cd', bg:'#f8f8f9' }
];
const byName = n => COLOR_PALETTES.find(p => p.name === n);
const NEUTRAL = { c1:'#1d1d1f', c2:'#8e8e93', bg:'#ffffff', k:.3 };

function hexToRgba(hex, a){
  const h = hex.replace('#','');
  return `rgba(${parseInt(h.slice(0,2),16)}, ${parseInt(h.slice(2,4),16)}, ${parseInt(h.slice(4,6),16)}, ${a})`;
}

function applySoftTheme(c1, c2, bg, k = 1){
  const r = document.documentElement.style;
  r.setProperty('--accent-1', c1);
  r.setProperty('--accent-2', c2);
  r.setProperty('--accent-3', c1);
  r.setProperty('--bg', bg || '#ffffff');
  r.setProperty('--glow-1', hexToRgba(c1, .10 * k));
  r.setProperty('--glow-2', hexToRgba(c2, .30 * k));
  r.setProperty('--glow-3', hexToRgba(c1, .06 * k));
}

function analyzeQueryColors(query){
  const q = query.toLowerCase();
  const words = [...q.matchAll(/\p{L}+/gu)].map(m => ({ w:m[0], i:m.index }));
  const byGroup = new Map();
  for (const p of COLOR_PALETTES){
    let pos = -1;
    for (const k of p.keys){
      let i = -1;
      if (/[\u4e00-\u9fff]/.test(k)) i = q.indexOf(k);
      else { const m = words.find(x => x.w.startsWith(k)); if (m) i = m.i; }
      if (i >= 0 && (pos < 0 || i < pos)) pos = i;
    }
    if (pos < 0) continue;
    const g = p.group || p.name, old = byGroup.get(g);
    if (!old || (p.pref && !old.p.pref)) byGroup.set(g, { p, pos });   // «sky blue» = один голубой, не два цвета
  }
  const hits = [...byGroup.values()].sort((a,b) => a.pos - b.pos);
  if (hits.length >= 2) return { c1:hits[0].p.c1, c2:hits[1].p.c1, bg:hits[0].p.bg, k:1 };
  if (hits.length === 1) return { ...hits[0].p, k:1 };
  if (/samba|sneaker|shoe|кроссов/.test(q)) return { ...byName('coffee'), k:1 };
  if (/jacket|coat|куртк/.test(q))          return { ...byName('stone'), k:1 };
  return NEUTRAL;   // цвет не назван — спокойный чёрно-белый сайт
}

/* ==== ПОИСК (демо) ================================================== */
async function askFindly(query){
  const th = analyzeQueryColors(query);
  applySoftTheme(th.c1, th.c2, th.bg, th.k);
  await new Promise(r => setTimeout(r, CONFIG.fakeDelayMs));
  return {
    reply: t('reply', { q:query }),
    items: [
      { title:`${query} — ${t('best')}`,    price:54, source:"Vinted", score:96, why:t('why1'), url:"#", emoji:"✨" },
      { title:`${query} — ${t('premium')}`, price:82, source:"eBay",   score:91, why:t('why2'), url:"#", emoji:"🏷️" },
      { title:`${query} — ${t('budget')}`,  price:36, source:"OLX",    score:85, why:t('why3'), url:"#", emoji:"📦" }
    ]
  };
}

const landing = $("landing"), chat = $("chat");
const messages = $("messages"), form = $("form"), input = $("input"), sendBtn = $("sendBtn");

function showChat(){ landing.classList.add("hidden"); chat.classList.remove("hidden"); setTimeout(() => input.focus(), 500); }
function showLanding(){ chat.classList.add("hidden"); landing.classList.remove("hidden"); }

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function scrollDown(){ messages.scrollTop = messages.scrollHeight; }

function addUserMsg(text){
  const el = document.createElement("div");
  el.className = "msg user"; el.textContent = text;
  messages.appendChild(el); scrollDown();
}
function addThinking(){
  const el = document.createElement("div");
  el.className = "msg ai";
  el.innerHTML = '<div class="typing"><i></i><i></i><i></i></div>';
  messages.appendChild(el); scrollDown();
  return el;
}
function cardHTML(item){
  return `
    <a class="card" href="${esc(item.url || "#")}" target="_blank" rel="noopener">
      <div class="thumb">${esc(item.emoji || "🛍️")}</div>
      <div class="info">
        <div class="title">${esc(item.title)}</div>
        <div class="meta">${esc(item.source)}</div>
        <div class="why">${esc(item.why)}</div>
      </div>
      <div class="side">
        <div class="price">${CONFIG.currency}${esc(item.price)}</div>
        <span class="badge">${esc(item.score)}</span>
      </div>
    </a>`;
}
function fillAiMsg(el, data){
  el.innerHTML = `<div>${esc(data.reply || "")}</div><div class="cards">${(data.items || []).map(cardHTML).join("")}</div>`;
  scrollDown();
}

let busy = false;
async function handleSend(text){
  if (busy || !text.trim()) return;
  busy = true; sendBtn.disabled = true;
  const hero = $("hero"); if (hero) hero.remove();
  addUserMsg(text);
  const aiEl = addThinking();
  try { fillAiMsg(aiEl, await askFindly(text)); }
  catch(err){ console.error(err); aiEl.textContent = t('wrong'); }
  finally { busy = false; sendBtn.disabled = false; input.focus(); }
}

const ph = $("ph");
let phIndex = 0;
const phList = () => I18N[lang].ph;
function syncPh(){ ph.classList.toggle("hide", input.value.length > 0); }
input.addEventListener("input", syncPh);
setInterval(() => {
  if (document.activeElement === input || input.value) return;
  phIndex = (phIndex + 1) % phList().length;
  ph.classList.remove("in"); ph.classList.add("leave");

    ph.textContent = phList()[phIndex];
    ph.classList.remove("leave"); void ph.offsetWidth; ph.classList.add("in");
  }, 320);
}, CONFIG.placeholderEveryMs);

/* ==== СОСТОЯНИЕ И FIRESTORE ========================================= */
const GUEST_KEY = "findly_guest_used";
let state = { used:0, user:null, plus:false };
let pendingUser = null;   // зарегистрирован, но почта не подтверждена

function readLocal(){ try { return parseInt(localStorage.getItem(GUEST_KEY) || "0", 10) || 0; } catch(e){ return 0; } }
state.used = readLocal();

async function saveState(){
  // счётчик всегда дублируем локально — выход из аккаунта его не обнуляет
  try { localStorage.setItem(GUEST_KEY, String(state.used)); } catch(e){}
  if (state.user && window.firebaseDb){
    try {
      const { doc, setDoc } = window.dbFns;
      await setDoc(doc(window.firebaseDb, "profiles", state.user.uid),
        { email:state.user.email, used:state.used, plus:state.plus }, { merge:true });
    } catch(e){ console.error(e); }
  }
}

async function loadUserProfile(authUser){
  pendingUser = (authUser && !authUser.emailVerified) ? authUser : null;
  if (!authUser || pendingUser){
    state.user = null; state.plus = false; state.used = readLocal();
    updateUI(); return;
  }
  state.user = { uid:authUser.uid, email:authUser.email };
  state.used = readLocal();
  if (window.firebaseDb){
    try {
      const { doc, getDoc } = window.dbFns;
      const snap = await getDoc(doc(window.firebaseDb, "profiles", authUser.uid));
      if (snap.exists()){
        const d = snap.data();
        state.used = Math.max(d.used || 0, state.used);
        state.plus = !!d.plus;
      }
    } catch(e){ console.error(e); }
  }
  await saveState();
  updateUI();
}

const checkAuthInterval = setInterval(() => {
  if (window.firebaseAuth && window.authFns){
    clearInterval(checkAuthInterval);
    window.firebaseAuth.languageCode = FB_LANG[lang] || lang;
    window.authFns.onAuthStateChanged(window.firebaseAuth, user => loadUserProfile(user));
  }
}, 100);

function limit(){ return state.plus ? Infinity : CONFIG.freeTotal; }
function left(){ return Math.max(0, limit() - state.used); }
function canSearch(){ return left() > 0; }

function updateUI(){
  $("counter").textContent = state.plus ? "Plus ∞" : t('free', { n:left() });
  $("accountBtn").textContent = state.user ? state.user.email.split("@")[0] : (pendingUser ? t('verifyEmail') : t('signIn'));
}

function showAuthStep(step){
  $("authStep").hidden = step !== "form";
  $("verifyStep").hidden = step !== "verify";
  if (step === "verify"){ $("verifyText").textContent = t('verifySent', { email:pendingUser.email }); $("verifyErr").textContent = ""; }
}
function openModal(id, note){
  if (id === "authModal"){
    $("authNote").textContent = note ? t(note) : "";
    showAuthStep(pendingUser ? "verify" : "form");
  }
  $(id).classList.add("show");
}
function closeModal(id){ $(id).classList.remove("show"); }
document.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", () => closeModal(b.dataset.close)));
document.querySelectorAll(".overlay").forEach(o => o.addEventListener("click", e => { if (e.target === o) closeModal(o.id); }));

function openGate(){
  if (state.user) openModal("payModal");
  else openModal("authModal", "gateNote");
}

function authErrorText(ex){
  const c = ex && ex.code || "";
  if (c.includes("email-already-in-use")) return t('exists');
  if (/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c)) return t('badCred');
  if (c.includes("too-many-requests")) return t('tooMany');
  return t('generic');
}

async function sendVerification(user){
  window.firebaseAuth.languageCode = FB_LANG[lang] || lang;
  await window.authFns.sendEmailVerification(user);
}

$("authForm").addEventListener("submit", async e => {
  e.preventDefault();
  const email = $("authEmail").value.trim(), pass = $("authPass").value, err = $("authError");
  if (!/^\S+@\S+\.\S+$/.test(email)) { err.textContent = t('badEmail'); return; }
  if (pass.length < 8)               { err.textContent = t('shortPass'); return; }
  err.textContent = ""; $("authSubmit").disabled = true;
  try {
    const { createUserWithEmailAndPassword, signInWithEmailAndPassword } = window.authFns;
    const res = authMode === "signup"
      ? await createUserWithEmailAndPassword(window.firebaseAuth, email, pass)
      : await signInWithEmailAndPassword(window.firebaseAuth, email, pass);
    $("authForm").reset();
    if (!res.user.emailVerified){
      pendingUser = res.user;
      if (authMode === "signup") await sendVerification(res.user);
      updateUI(); showAuthStep("verify");
    } else {
      await loadUserProfile(res.user);
      closeModal("authModal");
      if (!canSearch()) openModal("payModal");
    }
  } catch(ex){
    err.textContent = authErrorText(ex);
  } finally {
    $("authSubmit").disabled = false;
  }
});

$("verifyDone").addEventListener("click", async () => {
  if (!pendingUser) return;
  const err = $("verifyErr"); err.textContent = "";
  try {
    await pendingUser.reload();
    if (!pendingUser.emailVerified){ err.textContent = t('verifyNo'); return; }
    await pendingUser.getIdToken(true);
    await loadUserProfile(pendingUser);
    closeModal("authModal");
    if (!canSearch()) openModal("payModal");
  } catch(ex){ err.textContent = authErrorText(ex); }
});

$("verifyResend").addEventListener("click", async () => {
  if (!pendingUser) return;
  const b = $("verifyResend"), err = $("verifyErr");
  b.disabled = true; setTimeout(() => b.disabled = false, 30000);
  try { await sendVerification(pendingUser); err.textContent = t('verifyResent'); }
  catch(ex){ err.textContent = authErrorText(ex); }
});

$("verifyOther").addEventListener("click", async () => {
  await window.authFns.signOut(window.firebaseAuth);
  pendingUser = null; setAuthMode("signup"); showAuthStep("form"); updateUI();
});

$("accountBtn").addEventListener("click", async () => {
  if (state.user){
    if (confirm(t('signOutQ'))) await window.authFns.signOut(window.firebaseAuth);
  } else openModal("authModal");
});

function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-ph]").forEach(el => el.placeholder = t(el.dataset.i18nPh));
  $("brandBtn").title = t('home');
  input.setAttribute("aria-label", t('hero'));
  setAuthMode(authMode); updateUI();
  if (pendingUser) $("verifyText").textContent = t('verifySent', { email:pendingUser.email });
  if (window.firebaseAuth) window.firebaseAuth.languageCode = FB_LANG[lang] || lang;
  phIndex = 0; ph.textContent = phList()[0]; ph.classList.remove("leave"); ph.classList.add("in");
  document.querySelectorAll(".lang-menu button").forEach(b => b.classList.toggle("on", b.dataset.l === lang));
}
const menu = $("langMenu");
Object.keys(I18N).forEach(code => {
  const b = document.createElement("button");
  b.dataset.l = code; b.textContent = I18N[code].name;
  b.addEventListener("click", () => {
    lang = code; try { localStorage.setItem("findly_lang", code); } catch(e){}
    applyLang(); menu.hidden = true;
  });
  menu.appendChild(b);
});
$("langBtn").addEventListener("click", e => { e.stopPropagation(); menu.hidden = !menu.hidden; });
document.addEventListener("click", e => { if (!$("lang").contains(e.target)) menu.hidden = true; });
document.addEventListener("keydown", e => { if (e.key === "Escape") menu.hidden = true; });
